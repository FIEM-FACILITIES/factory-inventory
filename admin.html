<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Διαχείριση - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; 
            color: #f8fafc; margin: 0; padding: 20px; text-align: center; 
            min-height: 100vh;
        }
        h1 { color: #38bdf8; font-size: 34px; margin-bottom: 35px; font-weight: 700; letter-spacing: -0.5px; }
        
        .admin-panel { 
            background: #1e293b; padding: 25px; border-radius: 16px; 
            max-width: 800px; margin: 0 auto 40px auto; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; align-items: center; 
            border: 1px solid #334155;
        }
        input, select { 
            padding: 12px 15px; border-radius: 8px; border: 1px solid #334155; 
            font-size: 16px; text-align: center; background: #0f172a; color: #f8fafc; 
            font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.3s;
        }
        input:focus, select:focus { border-color: #38bdf8; }
        
        .btn-add { 
            background: #38bdf8; color: #0f172a; border: none; padding: 12px 25px; 
            font-weight: 700; font-size: 16px; border-radius: 8px; cursor: pointer; 
            transition: transform 0.1s ease, background-color 0.1s ease; box-shadow: 0 4px 10px rgba(56, 189, 248, 0.2);
        }
        .btn-add:active { transform: scale(0.95); background: #0ea5e9; box-shadow: none; }
        
        .columns-wrapper { display: flex; flex-direction: row; gap: 40px; justify-content: center; max-width: 1400px; margin: 0 auto; align-items: stretch; }
        
        .divider { width: 2px; background: linear-gradient(to bottom, transparent, #334155, transparent); border-radius: 5px; }

        details { flex: 1; min-width: 350px; background: transparent; text-align: left; }
        summary { 
            background-color: #1e293b; color: #38bdf8; font-size: 20px; font-weight: 600; 
            padding: 18px 25px; border-radius: 12px; cursor: pointer; list-style: none; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: transform 0.1s ease, background-color 0.1s ease; 
            border: 1px solid #334155; user-select: none;
        }
        summary:active { transform: scale(0.98); background-color: #334155; }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '▼'; font-size: 16px; color: #94a3b8; transition: transform 0.3s ease; }
        details[open] summary::after { transform: rotate(180deg); color: #38bdf8; }
        
        .inventory-section { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; padding-top: 25px; }
        
        .item-card { 
            background: #1e293b; padding: 25px 20px; border-radius: 16px; 
            display: flex; flex-direction: column; text-align: center; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.2); border: 1px solid #334155;
        }
        
        .item-name { font-size: 18px; font-weight: 600; color: #e2e8f0; line-height: 1.3; height: 48px; display: flex; align-items: center; justify-content: center; }
        .item-stock { font-size: 40px; color: #38bdf8; margin: 15px 0; font-weight: 700; }
        
        .restock-area { display: flex; gap: 8px; margin-bottom: 15px; }
        .restock-input { flex: 1; min-width: 0; padding: 10px; font-weight: 600; }
        
        .btn-restock { 
            flex: 2; background: #10b981; color: white; border: none; padding: 10px; 
            border-radius: 8px; cursor: pointer; font-weight: 600; transition: transform 0.1s ease, background-color 0.1s ease;
        }
        .btn-restock:active { transform: scale(0.95); background: #059669; }
        
        .btn-delete { 
            background: transparent; color: #ef4444; border: 1px solid #ef4444; 
            padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; 
            margin-top: auto; transition: transform 0.1s ease, background-color 0.1s ease;
        }
        .btn-delete:active { transform: scale(0.95); background: #ef4444; color: white; }

        @media (max-width: 850px) {
            .columns-wrapper { flex-direction: column; }
            .divider { width: 100%; height: 2px; background: linear-gradient(to right, transparent, #334155, transparent); margin: 15px 0; }
        }
    </style>
</head>
<body>

    <h1>Πίνακας Ελέγχου Αποθήκης</h1>

    <div class="admin-panel">
        <input type="text" id="new-name" placeholder="Όνομα είδους">
        <input type="number" id="new-stock" placeholder="Αρχική Ποσότητα">
        <select id="new-category">
            <option value="cleaning">Καθαριστικά</option>
            <option value="electrical">Ηλεκτρολογικά</option>
        </select>
        <button class="btn-add" id="add-item-btn">Καταχώρηση</button>
    </div>

    <div class="columns-wrapper">
        <details open>
            <summary>Καθαριστικά</summary>
            <div id="cleaning-container" class="inventory-section"></div>
        </details>
        
        <div class="divider"></div>

        <details>
            <summary>Ηλεκτρολογικά</summary>
            <div id="electrical-container" class="inventory-section"></div>
        </details>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, increment, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBYYM4O7qYiVM1H4pOAxzpGZUBPEzH8gZI",
          authDomain: "janitorial-closet-e1682.firebaseapp.com",
          projectId: "janitorial-closet-e1682",
          storageBucket: "janitorial-closet-e1682.firebasestorage.app",
          messagingSenderId: "942021937097",
          appId: "1:942021937097:web:560ce78117a4746a4a4a18"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const cleaningContainer = document.getElementById('cleaning-container');
        const electricalContainer = document.getElementById('electrical-container');

        onSnapshot(collection(db, "items"), (snapshot) => {
            cleaningContainer.innerHTML = '';
            electricalContainer.innerHTML = '';
            
            snapshot.forEach((docSnapshot) => {
                const item = docSnapshot.data();
                const id = docSnapshot.id;
                
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-name">${item.name}</div>
                    <div class="item-stock">${item.stock} τμχ</div>
                    <div class="restock-area">
                        <input type="number" id="input-${id}" class="restock-input" placeholder="+">
                        <button class="btn-restock" id="btn-${id}">Ανανέωση</button>
                    </div>
                    <button class="btn-delete" id="del-${id}">Διαγραφή</button>
                `;

                if (item.category === 'electrical') {
                    electricalContainer.appendChild(card);
                } else {
                    cleaningContainer.appendChild(card);
                }

                document.getElementById(`btn-${id}`).addEventListener('click', async () => {
                    const inputField = document.getElementById(`input-${id}`);
                    const inputVal = parseInt(inputField.value);
                    if (inputVal && inputVal > 0) {
                        const itemRef = doc(db, "items", id);
                        await updateDoc(itemRef, { stock: increment(inputVal) });
                        inputField.value = '';
                    }
                });

                document.getElementById(`del-${id}`).addEventListener('click', async () => {
                    if (confirm(`Διαγραφή του είδους "${item.name}";`)) {
                        await deleteDoc(doc(db, "items", id));
                    }
                });
            });
        });

        document.getElementById('add-item-btn').addEventListener('click', async () => {
            const name = document.getElementById('new-name').value;
            const stock = parseInt(document.getElementById('new-stock').value);
            const category = document.getElementById('new-category').value;
            
            if (name && stock >= 0) {
                await addDoc(collection(db, "items"), { 
                    name: name, 
                    stock: stock,
                    category: category 
                });
                document.getElementById('new-name').value = '';
                document.getElementById('new-stock').value = '';
            } else {
                alert('Παρακαλώ συμπλήρωσε σωστά το όνομα και την ποσότητα.');
            }
        });
    </script>
</body>
</html>
