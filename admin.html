<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Διαχείριση - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; 
            margin: 0; padding: 20px; text-align: center; min-height: 100vh;
            display: flex; flex-direction: column; /* Για να κολλήσει η υπογραφή κάτω */
        }
        
        /* --- ΣΤΥΛ ΓΙΑ ΤΗΝ ΟΘΟΝΗ LOGIN --- */
        #login-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex-grow: 1; /* Πιάνει τον κενό χώρο */
        }
        .login-box {
            background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155; width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 15px;
        }
        .login-box h2 { margin: 0 0 10px 0; color: #38bdf8; }
        .login-input {
            padding: 12px; border-radius: 8px; border: 1px solid #334155; font-size: 16px; text-align: left;
            background: #0f172a; color: white; font-family: 'Inter', sans-serif; outline: none;
        }
        .login-input:focus { border-color: #38bdf8; }
        .login-btn {
            background: #38bdf8; color: #0f172a; border: none; padding: 12px; font-size: 16px;
            font-weight: 700; border-radius: 8px; cursor: pointer; margin-top: 10px;
        }
        .login-btn:active { background: #0ea5e9; }
        .error-msg { color: #ef4444; font-size: 14px; display: none; font-weight: 600; }

        /* --- ΣΤΥΛ ΕΦΑΡΜΟΓΗΣ --- */
        #main-app { 
            display: none; 
            flex-grow: 1; /* Πιάνει τον κενό χώρο */
            width: 100%;
        }

        .header-container { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto 20px auto; }
        h1 { color: #38bdf8; font-size: 34px; margin: 0; font-weight: 700; letter-spacing: -0.5px; }
        .logout-btn { background: transparent; border: 2px solid #ef4444; color: #ef4444; padding: 8px 15px; border-radius: 8px; font-weight: 700; cursor: pointer; }

        .admin-panel { 
            background: #1e293b; padding: 25px; border-radius: 16px; max-width: 1250px; margin: 0 auto 30px auto; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; align-items: flex-start; border: 1px solid #334155;
        }
        .input-group { display: flex; flex-direction: column; gap: 5px; align-items: center; }

        input, select { 
            padding: 12px; border-radius: 8px; border: 1px solid #334155; font-size: 15px; text-align: center; 
            background: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.3s;
            box-sizing: border-box; min-width: 160px;
        }
        input:focus, select:focus { border-color: #38bdf8; }
        
        select {
            appearance: none; -webkit-appearance: none; padding-right: 30px;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.3c0%204.9%201.8%209.2%205.4%2012.8l133.7%20133.7c3.6%203.6%207.9%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
            background-repeat: no-repeat; background-position: right 10px top 50%; background-size: 12px auto; cursor: pointer;
        }

        .btn-add { background: #38bdf8; color: #0f172a; border: none; padding: 12px 25px; font-weight: 700; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 2px; }
        .columns-wrapper { display: flex; flex-direction: row; gap: 40px; justify-content: center; max-width: 1400px; margin: 0 auto; align-items: stretch; }
        .divider { width: 2px; background: linear-gradient(to bottom, transparent, #334155, transparent); border-radius: 5px; }

        details { flex: 1; min-width: 350px; background: transparent; text-align: left; }
        summary.main-summary { background-color: #1e293b; color: #38bdf8; font-size: 22px; font-weight: 700; padding: 18px 25px; border-radius: 12px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
        summary.main-summary::-webkit-details-marker { display: none; }
        summary.main-summary::after { content: '▼'; font-size: 16px; color: #94a3b8; }
        details[open] > summary.main-summary::after { transform: rotate(180deg); color: #38bdf8; }
        
        .inventory-section { display: block; padding-top: 15px; }
        .sub-details { background: #1e293b; margin-bottom: 15px; border-radius: 12px; padding: 10px; border: 1px solid #334155; }
        summary.sub-summary { background-color: #334155; color: #e2e8f0; font-size: 18px; font-weight: 600; padding: 12px 20px; border-radius: 8px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        summary.sub-summary::-webkit-details-marker { display: none; }
        summary.sub-summary::after { content: '▼'; font-size: 14px; }

        .child-details { background: #0f172a; margin: 10px 0; border-radius: 10px; padding: 8px; border: 1px solid #334155; }
        summary.child-summary { background-color: #1e293b; color: #38bdf8; font-size: 16px; font-weight: 600; padding: 10px 15px; border-radius: 6px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        summary.child-summary::-webkit-details-marker { display: none; }
        summary.child-summary::after { content: '▼'; font-size: 12px; }

        .sub-child-details { background: #1e293b; margin: 8px 0; border-radius: 8px; padding: 6px; border: 1px solid #334155; }
        summary.sub-child-summary { background-color: #334155; color: #e2e8f0; font-size: 15px; font-weight: 600; padding: 8px 12px; border-radius: 6px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        summary.sub-child-summary::-webkit-details-marker { display: none; }
        summary.sub-child-summary::after { content: '▼'; font-size: 10px; }

        .sub-inventory-section { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; padding-top: 15px; padding-bottom: 5px; }
        
        .item-card { background: #0f172a; padding: 20px 15px; border-radius: 12px; display: flex; flex-direction: column; text-align: center; border: 1px solid #334155; }
        .item-name { font-size: 16px; font-weight: 600; color: #e2e8f0; height: 45px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
        .item-stock { font-size: 36px; color: #38bdf8; margin: 10px 0; font-weight: 700; }
        
        .input-row { margin-bottom: 10px; }
        .restock-input { width: 100%; box-sizing: border-box; padding: 10px; font-weight: 600; }
        
        .action-buttons { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn-add-stock { flex: 1; background: #10b981; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-sub-stock { flex: 1; background: #f59e0b; color: #0f172a; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-delete { background: transparent; color: #ef4444; border: 1px solid #ef4444; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: auto; }

        .admin-sections-wrapper { display: flex; flex-wrap: wrap; gap: 30px; max-width: 1400px; margin: 40px auto 0 auto; }
        .section-box { flex: 1; min-width: 350px; background: #1e293b; padding: 25px; border-radius: 16px; border: 1px solid #334155; text-align: left; }
        
        .workers-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; max-height: 200px; overflow-y: auto; }
        .worker-chip { background: #0f172a; border: 1px solid #334155; padding: 8px 15px; border-radius: 20px; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; }
        .worker-chip-btns { display: flex; gap: 6px; align-items: center; }
        .btn-edit-worker { background: none; border: none; color: #38bdf8; cursor: pointer; font-size: 14px; padding: 0; }
        .btn-del-worker { background: none; border: none; color: #ef4444; cursor: pointer; font-weight: bold; font-size: 16px; padding: 0; }

        .history-box { max-height: 200px; overflow-y: auto; margin-top: 15px; }
        .history-item { padding: 8px 0; border-bottom: 1px solid #334155; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .history-worker { color: #38bdf8; font-weight: 700; }
        .history-time { color: #94a3b8; font-size: 12px; }

        /* --- ΣΤΥΛ ΓΙΑ ΤΗΝ ΥΠΟΓΡΑΦΗ (ΔΙΑΚΡΙΤΙΚΗ ΣΤΟ ΤΕΛΟΣ) --- */
        .creator-credit {
            text-align: center;
            margin-top: auto; /* Το σπρώχνει τέρμα κάτω */
            padding-top: 40px;
            font-size: 13px;
            color: #475569; /* Σκούρο γκρι για να δένει με το dark theme */
            font-weight: 500;
            width: 100%;
        }

        @media (max-width: 850px) {
            .columns-wrapper { flex-direction: column; }
            .divider { width: 100%; height: 2px; background: linear-gradient(to right, transparent, #334155, transparent); margin: 15px 0; }
            .admin-sections-wrapper { flex-direction: column; }
            .header-container { flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <!-- ΟΘΟΝΗ LOGIN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Είσοδος Διαχειριστή</h2>
            <div id="login-error" class="error-msg">Λάθος Email ή Κωδικός</div>
            <input type="email" id="login-email" class="login-input" placeholder="Email (πχ. admin@...)">
            <input type="password" id="login-password" class="login-input" placeholder="Κωδικός">
            <button id="login-btn" class="login-btn">Σύνδεση</button>
        </div>
    </div>

    <!-- ΚΥΡΙΩΣ ΕΦΑΡΜΟΓΗ -->
    <div id="main-app">
        <div class="header-container">
            <div></div>
            <h1>Πίνακας Ελέγχου Αποθήκης</h1>
            <button id="logout-btn" class="logout-btn">Αποσύνδεση</button>
        </div>

        <div class="admin-panel">
            <div class="input-group">
                <input type="text" id="new-name" placeholder="Όνομα είδους">
            </div>
            <div class="input-group">
                <input type="text" id="new-code" placeholder="Κωδικός (Προαιρετικό)">
            </div>
            <div class="input-group">
                <input type="number" id="new-stock" placeholder="Αρχική Ποσ.">
            </div>
            <div class="input-group">
                <select id="new-category">
                    <option value="cleaning">Καθαριστικά</option>
                    <option value="electrical">Ηλεκτρολογικά</option>
                </select>
            </div>
            <div class="input-group" id="group-cleaning-wrapper">
                <select id="subcategory-cleaning">
                    <option value="" disabled selected>Επιλέξτε Ομάδα</option>
                    <option value="__NEW__">--- Νέα Ομάδα ---</option>
                </select>
                <input type="text" id="new-cleaning-text" placeholder="Όνομα νέας ομάδας" style="display: none; margin-top: 5px; width: 100%;">
            </div>

            <div class="input-group" id="group-electrical-wrapper" style="display: none;">
                <select id="subcategory-electrical">
                    <option value="" disabled selected>Επιλέξτε Ομάδα</option>
                    <option value="__NEW__">--- Νέα Ομάδα ---</option>
                </select>
                <input type="text" id="new-electrical-text" placeholder="Όνομα νέας ομάδας" style="display: none; margin-top: 5px; width: 100%;">
            </div>
            <div class="input-group">
                <input type="text" id="new-childcategory" placeholder="Χρώμα (πχ. Μαύρα)">
            </div>
            <div class="input-group">
                <input type="text" id="new-subchildcategory" placeholder="Νούμερο (πχ. Small)">
            </div>
            <button class="btn-add" id="add-item-btn">Καταχώρηση</button>
        </div>

        <div class="columns-wrapper">
            <details id="main-cleaning">
                <summary class="main-summary">Καθαριστικά</summary>
                <div id="cleaning-container" class="inventory-section"></div>
            </details>
            <div class="divider"></div>
            <details id="main-electrical">
                <summary class="main-summary">Ηλεκτρολογικά</summary>
                <div id="electrical-container" class="inventory-section"></div>
            </details>
        </div>

        <div class="admin-sections-wrapper">
            <div class="section-box">
                <h2 style="color: #38bdf8; font-size: 20px; margin-top: 0; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;">
                    <span>👥 Διαχείριση Εργαζομένων <span id="worker-count" style="font-size: 16px; color: #94a3b8; margin-left: 5px;">(0)</span></span>
                </h2>
                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <input type="text" id="worker-input-name" placeholder="Όνομα νέου εργαζομένου" style="flex: 1; padding: 10px; text-transform: uppercase;">
                    <button class="btn-add" id="add-worker-btn" style="padding: 10px 15px; font-size: 14px;">Προσθήκη</button>
                </div>
                <div class="workers-list" id="workers-list-container">
                    <div style="color: #94a3b8; font-size: 14px;">Φόρτωση εργαζομένων...</div>
                </div>
            </div>

            <div class="section-box">
                <h2 style="color: #38bdf8; font-size: 20px; margin-top: 0; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                    <span>📋 Ιστορικό Κινήσεων</span>
                    <button id="clear-history-btn" style="background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;">Απαλοιφή</button>
                </h2>
                <div class="history-box" id="history-container">
                    <div style="color: #94a3b8; font-size: 14px; text-align: center;">Φόρτωση ιστορικού...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ΥΠΟΓΡΑΦΗ ΔΗΜΙΟΥΡΓΟΥ ΕΞΩ ΑΠΟ ΤΑ ΠΛΑΙΣΙΑ -->
    <div class="creator-credit">👨‍💻 Made by Fotis Vasilopoulos 👨‍💻</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, increment, addDoc, deleteDoc, setDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBYYM4O7qYiVM1H4pOAxzpGZUBPEzH8gZI",
          authDomain: "janitorial-closet-e1682.firebaseapp.com",
          projectId: "janitorial-closet-e1682",
          storageBucket: "janitorial-closet-e1682.firebasestorage.app",
          messagingSenderId: "942021937097",
          appId: "1:942021937097:web:560ce78117a4746a4a4a18"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const loginScreen = document.getElementById('login-screen');
        const mainApp = document.getElementById('main-app');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const errorMsg = document.getElementById('login-error');

        const cleaningContainer = document.getElementById('cleaning-container');
        const electricalContainer = document.getElementById('electrical-container');
        const historyContainer = document.getElementById('history-container');
        const workersListContainer = document.getElementById('workers-list-container');
        
        const categorySelect = document.getElementById('new-category');
        const cleaningWrapper = document.getElementById('group-cleaning-wrapper');
        const electricalWrapper = document.getElementById('group-electrical-wrapper');
        const subcleaningSelect = document.getElementById('subcategory-cleaning');
        const newCleaningText = document.getElementById('new-cleaning-text');
        const subelectricalSelect = document.getElementById('subcategory-electrical');
        const newElectricalText = document.getElementById('new-electrical-text');
        const childCategoryInput = document.getElementById('new-childcategory');
        const subChildCategoryInput = document.getElementById('new-subchildcategory');
        const workerInputName = document.getElementById('worker-input-name');
        const addWorkerBtn = document.getElementById('add-worker-btn');
        
        let unsubscribeWorkers, unsubscribeItems, unsubscribeHistory;

        const handleLoginEnter = (e) => { if (e.key === 'Enter') { e.preventDefault(); loginBtn.click(); } };
        document.getElementById('login-email').addEventListener('keypress', handleLoginEnter);
        document.getElementById('login-password').addEventListener('keypress', handleLoginEnter);

        loginBtn.addEventListener('click', () => {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            signInWithEmailAndPassword(auth, email, pass).catch(error => {
                errorMsg.style.display = 'block';
            });
        });

        logoutBtn.addEventListener('click', () => { signOut(auth); });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.style.display = 'none';
                mainApp.style.display = 'block';
                loadData();
            } else {
                loginScreen.style.display = 'flex';
                mainApp.style.display = 'none';
                document.getElementById('login-password').value = '';
                errorMsg.style.display = 'none';
                if(unsubscribeWorkers) unsubscribeWorkers();
                if(unsubscribeItems) unsubscribeItems();
                if(unsubscribeHistory) unsubscribeHistory();
            }
        });

        categorySelect.addEventListener('change', function() {
            if (this.value === 'cleaning') {
                cleaningWrapper.style.display = 'flex'; electricalWrapper.style.display = 'none';
            } else {
                cleaningWrapper.style.display = 'none'; electricalWrapper.style.display = 'flex';
            }
        });

        subcleaningSelect.addEventListener('change', function() {
            if (this.value === '__NEW__') { newCleaningText.style.display = 'block'; newCleaningText.focus(); } 
            else { newCleaningText.style.display = 'none'; newCleaningText.value = ''; }
        });

        subelectricalSelect.addEventListener('change', function() {
            if (this.value === '__NEW__') { newElectricalText.style.display = 'block'; newElectricalText.focus(); } 
            else { newElectricalText.style.display = 'none'; newElectricalText.value = ''; }
        });

        workerInputName.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addWorkerBtn.click();
            }
        });

        addWorkerBtn.addEventListener('click', async () => {
            let name = workerInputName.value.trim().toUpperCase();
            if (!name) name = 'ΝΕΟΣ ΕΡΓΑΖΟΜΕΝΟΣ';
            try { await setDoc(doc(db, "workers", name), { name: name }); workerInputName.value = ''; } catch (e) {}
        });

        document.getElementById('clear-history-btn').addEventListener('click', async () => {
            if (confirm('Είστε σίγουροι ότι θέλετε να διαγράψετε ΟΛΟ το ιστορικό; Αυτή η ενέργεια δεν αναιρείται.')) {
                try {
                    const querySnapshot = await getDocs(collection(db, "history"));
                    querySnapshot.forEach(async (docSnapshot) => { await deleteDoc(doc(db, "history", docSnapshot.id)); });
                } catch (e) { alert('Υπήρξε ένα σφάλμα κατά τη διαγραφή του ιστορικού.'); }
            }
        });

        function loadData() {
            unsubscribeWorkers = onSnapshot(collection(db, "workers"), (snapshot) => {
                workersListContainer.innerHTML = '';
                const workers = [];
                snapshot.forEach(docSnap => { workers.push({ id: docSnap.id, name: docSnap.data().name }); });
                document.getElementById('worker-count').textContent = `(${workers.length})`;

                if (workers.length === 0) {
                    workersListContainer.innerHTML = '<div style="color: #94a3b8; font-size: 14px;">Δεν υπάρχουν εργαζόμενοι.</div>';
                    return;
                }
                workers.sort((a, b) => a.name.localeCompare(b.name)).forEach(w => {
                    const chip = document.createElement('div');
                    chip.className = 'worker-chip';
                    chip.innerHTML = `
                        <span>${w.name}</span>
                        <div class="worker-chip-btns">
                            <button class="btn-edit-worker" title="Μετονομασία">✏️</button>
                            <button class="btn-del-worker" title="Διαγραφή">✕</button>
                        </div>
                    `;
                    chip.querySelector('.btn-edit-worker').addEventListener('click', async () => {
                        let newName = prompt(`Νέο όνομα για "${w.name}":`, w.name);
                        if (newName && newName.trim() !== "") {
                            newName = newName.trim().toUpperCase();
                            if (newName !== w.name) {
                                try { await setDoc(doc(db, "workers", newName), { name: newName }); await deleteDoc(doc(db, "workers", w.id)); } catch(e) {}
                            }
                        }
                    });
                    chip.querySelector('.btn-del-worker').addEventListener('click', async () => {
                        if (confirm(`Διαγραφή "${w.name}";`)) { await deleteDoc(doc(db, "workers", w.id)); }
                    });
                    workersListContainer.appendChild(chip);
                });
            });

            unsubscribeItems = onSnapshot(collection(db, "items"), (snapshot) => {
                cleaningContainer.innerHTML = ''; electricalContainer.innerHTML = '';
                
                const cleaningSet = new Set(); const electricalSet = new Set();
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.subcategory) {
                        if (data.category === 'electrical') electricalSet.add(data.subcategory.trim());
                        else cleaningSet.add(data.subcategory.trim());
                    }
                });
                const refreshDropdown = (selectEl, set, newOptVal) => {
                    const current = selectEl.value; const promptOpt = selectEl.options[0]; const newOpt = selectEl.options[selectEl.options.length - 1];
                    selectEl.innerHTML = ''; selectEl.appendChild(promptOpt);
                    Array.from(set).sort().forEach(sub => { const opt = document.createElement('option'); opt.value = sub; opt.textContent = sub; selectEl.appendChild(opt); });
                    selectEl.appendChild(newOpt);
                    if (Array.from(selectEl.options).some(o => o.value === current)) selectEl.value = current;
                };
                refreshDropdown(subcleaningSelect, cleaningSet); refreshDropdown(subelectricalSelect, electricalSet);

                const tree = { cleaning: { items: [], children: {} }, electrical: { items: [], children: {} } };
                snapshot.forEach((docSnapshot) => {
                    const item = docSnapshot.data();
                    const cat = item.category || 'cleaning';
                    let sub = item.subcategory || 'Γενικά'; let child = item.childcategory || 'Γενικά'; let subchild = item.subchildcategory || 'Γενικά';
                    if (!tree[cat]) tree[cat] = { items: [], children: {} };
                    if (!tree[cat].children[sub]) tree[cat].children[sub] = { items: [], children: {} };
                    let subNode = tree[cat].children[sub];
                    if (child === 'Γενικά' && subchild === 'Γενικά') { subNode.items.push({ id: docSnapshot.id, ...item }); } 
                    else if (child !== 'Γενικά' && subchild === 'Γενικά') {
                        if (!subNode.children[child]) subNode.children[child] = { items: [], children: {} };
                        subNode.children[child].items.push({ id: docSnapshot.id, ...item });
                    } else if (child === 'Γενικά' && subchild !== 'Γενικά') {
                        if (!subNode.children[subchild]) subNode.children[subchild] = { items: [], children: {} };
                        subNode.children[subchild].items.push({ id: docSnapshot.id, ...item });
                    } else {
                        if (!subNode.children[child]) subNode.children[child] = { items: [], children: {} };
                        let childNode = subNode.children[child];
                        if (!childNode.children[subchild]) childNode.children[subchild] = { items: [], children: {} };
                        childNode.children[subchild].items.push({ id: docSnapshot.id, ...item });
                    }
                });

                const renderNode = (container, node, levelClass, summaryClass) => {
                    if (node.items && node.items.length > 0) {
                        const grid = document.createElement('div'); grid.className = 'sub-inventory-section';
                        node.items.sort((a, b) => a.name.localeCompare(b.name)).forEach(item => {
                            const card = document.createElement('div'); card.className = 'item-card';
                            card.innerHTML = `
                                <div class="item-name"><span>${item.name}</span>${item.code ? `<span style="font-size: 12px; font-weight: 400; color: #94a3b8; margin-top: 4px;">Κωδ: ${item.code}</span>` : ''}</div>
                                <div class="item-stock">${item.stock} τμχ</div>
                                <div class="input-row"><input type="number" id="input-${item.id}" class="restock-input" placeholder="Ποσότητα"></div>
                                <div class="action-buttons"><button class="btn-add-stock" id="add-${item.id}">+</button><button class="btn-sub-stock" id="sub-${item.id}">-</button></div>
                                <button class="btn-delete" id="del-${item.id}">Διαγραφή</button>
                            `;
                            grid.appendChild(card);
                            setTimeout(() => {
                                document.getElementById(`input-${item.id}`).addEventListener('keypress', (e) => {
                                    if (e.key === 'Enter') {
                                        e.preventDefault();
                                        document.getElementById(`add-${item.id}`).click();
                                    }
                                });

                                document.getElementById(`add-${item.id}`).addEventListener('click', async () => {
                                    let val = parseInt(document.getElementById(`input-${item.id}`).value); if (isNaN(val) || val <= 0) val = 1;
                                    await updateDoc(doc(db, "items", item.id), { stock: increment(val) }); document.getElementById(`input-${item.id}`).value = '';
                                });
                                document.getElementById(`sub-${item.id}`).addEventListener('click', async () => {
                                    let val = parseInt(document.getElementById(`input-${item.id}`).value); if (isNaN(val) || val <= 0) val = 1;
                                    if (val > item.stock) { alert('Δεν υπάρχει τόσο απόθεμα!'); return; }
                                    await updateDoc(doc(db, "items", item.id), { stock: increment(-val) }); document.getElementById(`input-${item.id}`).value = '';
                                });
                                document.getElementById(`del-${item.id}`).addEventListener('click', async () => {
                                    if (confirm(`Διαγραφή του είδους "${item.name}";`)) { await deleteDoc(doc(db, "items", item.id)); }
                                });
                            }, 0);
                        });
                        container.appendChild(grid);
                    }
                    if (node.children) {
                        Object.keys(node.children).sort().forEach(childKey => {
                            const childNode = node.children[childKey]; const details = document.createElement('details'); details.className = levelClass;
                            details.innerHTML = `<summary class="${summaryClass}">${childKey}</summary><div class="node-container" style="padding-top: 8px; padding-bottom: 5px;"></div>`;
                            renderNode(details.querySelector('.node-container'), childNode, 'sub-child-details', 'sub-child-summary'); container.appendChild(details);
                        });
                    }
                };

                const renderCategory = (container, catData) => {
                    if(!catData || !catData.children) return;
                    Object.keys(catData.children).sort().forEach(subKey => {
                        const subNode = catData.children[subKey]; const details = document.createElement('details'); details.className = 'sub-details';
                        details.innerHTML = `<summary class="sub-summary">${subKey}</summary><div class="node-container" style="padding-top: 10px;"></div>`;
                        renderNode(details.querySelector('.node-container'), subNode, 'child-details', 'child-summary'); container.appendChild(details);
                    });
                };
                renderCategory(cleaningContainer, tree.cleaning); renderCategory(electricalContainer, tree.electrical);
            });

            unsubscribeHistory = onSnapshot(collection(db, "history"), (snapshot) => {
                historyContainer.innerHTML = ''; const logs = [];
                snapshot.forEach(docSnap => { logs.push({ id: docSnap.id, ...docSnap.data() }); });
                if (logs.length === 0) { historyContainer.innerHTML = '<div style="color: #94a3b8; font-size: 14px; text-align: center;">Δεν υπάρχουν καταγεγραμμένες κινήσεις ακόμα.</div>'; return; }
                logs.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                logs.forEach(log => {
                    const div = document.createElement('div'); div.className = 'history-item';
                    div.innerHTML = `<div><span class="history-worker">${log.worker}</span> <span>αφαίρεσε <b>${log.quantity} τμχ</b> από <b>${log.item}</b></span></div><div class="history-time">${log.timestamp}</div>`;
                    historyContainer.appendChild(div);
                });
            });
        }

        const addItemInputs = ['new-name', 'new-code', 'new-stock', 'new-cleaning-text', 'new-electrical-text', 'new-childcategory', 'new-subchildcategory'];
        addItemInputs.forEach(id => {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        document.getElementById('add-item-btn').click();
                    }
                });
            }
        });

        document.getElementById('add-item-btn').addEventListener('click', async () => {
            let name = document.getElementById('new-name').value.trim(); if (!name) name = "Χωρίς Όνομα"; 
            let code = document.getElementById('new-code').value.trim();
            let stock = parseInt(document.getElementById('new-stock').value); if (isNaN(stock) || stock < 0) stock = 0; 
            const category = categorySelect.value || 'cleaning';
            const childcategory = childCategoryInput.value.trim() || 'Γενικά'; const subchildcategory = subChildCategoryInput.value.trim() || 'Γενικά';
            let subcategory = category === 'cleaning' ? (subcleaningSelect.value === '__NEW__' ? newCleaningText.value.trim() : subcleaningSelect.value) : (subelectricalSelect.value === '__NEW__' ? newElectricalText.value.trim() : subelectricalSelect.value);
            if (!subcategory || subcategory === "-- Επιλέξτε Όνομα --") subcategory = "Γενικά"; 
            
            await addDoc(collection(db, "items"), { name: name, code: code, stock: stock, category: category, subcategory: subcategory, childcategory: childcategory, subchildcategory: subchildcategory });
            document.getElementById('new-name').value = ''; document.getElementById('new-code').value = ''; document.getElementById('new-stock').value = '';
            childCategoryInput.value = ''; subChildCategoryInput.value = ''; subcleaningSelect.value = ''; newCleaningText.value = ''; newCleaningText.style.display = 'none';
            subelectricalSelect.value = ''; newElectricalText.value = ''; newElectricalText.style.display = 'none';
        });
    </script>
</body>
</html>
